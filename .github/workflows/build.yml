name: Build NetScan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org ro.netscan --project-name netscan .

      - run: flutter pub get

      - name: Patch manifest / app name
        run: dart run tool/patch_platforms.dart

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NetScan-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetScan-android
          path: dist/NetScan-android.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org ro.netscan --project-name netscan .

      - run: flutter pub get

      - name: Patch app name
        run: dart run tool/patch_platforms.dart

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = "build/windows/x64/runner/Release"
          Copy-Item -Recurse $src "dist/NetScan"
          Compress-Archive -Path "dist/NetScan/*" -DestinationPath "dist/NetScan-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NetScan-windows
          path: dist/NetScan-windows.zip

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Rolling "latest" release: always the newest build from main.
      - name: Update "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest -R "$REPO" --yes --cleanup-tag || true
          gh release create latest dist/NetScan-android.apk dist/NetScan-windows.zip \
            -R "$REPO" --target "$GITHUB_SHA" --latest \
            --title "NetScan - ultima versiune" \
            --notes "Build automat din main (${GITHUB_SHA::7}). Android: NetScan-android.apk. Windows: dezarhiveaza NetScan-windows.zip si ruleaza NetScan.exe."

      - name: Versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/NetScan-android.apk dist/NetScan-windows.zip \
            -R "$REPO" --title "NetScan $GITHUB_REF_NAME" --generate-notes
