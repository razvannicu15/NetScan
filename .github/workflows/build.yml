name: Build NetScan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org ro.netscan --project-name netscan .

      - name: Patch manifest / app name
        run: python3 tool/patch_platforms.py

      - run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NetScan-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetScan-android
          path: dist/NetScan-android.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org ro.netscan --project-name netscan .

      - name: Patch app name
        run: python tool/patch_platforms.py

      - run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = "build/windows/x64/runner/Release"
          Copy-Item -Recurse $src "dist/NetScan"
          Compress-Archive -Path "dist/NetScan/*" -DestinationPath "dist/NetScan-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NetScan-windows
          path: dist/NetScan-windows.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: NetScan ${{ github.ref_name }}
          files: |
            dist/NetScan-android.apk
            dist/NetScan-windows.zip
          body: |
            **Android:** descarcă `NetScan-android.apk` și instalează-l (permite instalarea din surse necunoscute).
            **Windows:** descarcă `NetScan-windows.zip`, dezarhivează și rulează `NetScan.exe`.
