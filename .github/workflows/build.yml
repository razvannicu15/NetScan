name: Build NetScan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$REPO" --title "NetScan $TAG" --generate-notes
          else
            TAG=latest
            gh release view latest -R "$REPO" >/dev/null 2>&1 || \
              gh release create latest -R "$REPO" --target "$GITHUB_SHA" --latest \
                --title "NetScan - ultima versiune" --notes "Build automat."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --platforms=android,windows --org ro.netscan --project-name netscan .

      - run: flutter pub get

      - name: Patch manifest / app name
        run: dart run tool/patch_platforms.dart

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to release
        if: needs.prepare.outputs.tag != ''
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk NetScan-android.apk
          gh release upload "${{ needs.prepare.outputs.tag }}" NetScan-android.apk -R "$REPO" --clobber

  windows:
    name: Windows EXE
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create --platforms=android,windows --org ro.netscan --project-name netscan .

      - run: flutter pub get

      - name: Patch app name
        run: dart run tool/patch_platforms.dart

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "NetScan-windows.zip"

      - name: Upload to release
        if: needs.prepare.outputs.tag != ''
        run: gh release upload "${{ needs.prepare.outputs.tag }}" NetScan-windows.zip -R "$REPO" --clobber

  notes:
    name: Update release notes
    needs: [prepare, android, windows]
    if: needs.prepare.outputs.tag == 'latest'
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release edit latest -R "$REPO" --notes "Build automat din main ($(date -u +'%Y-%m-%d %H:%M') UTC, commit ${GITHUB_SHA::7}).

          Android: NetScan-android.apk
          Windows: dezarhiveaza NetScan-windows.zip si ruleaza NetScan.exe"
